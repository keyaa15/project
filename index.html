<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Georgia", serif;
    background: #1e1e2f;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
    overflow: hidden;
}

.intro {
    text-align: center;
    font-size: 1.4rem;
    margin-bottom: 30px;
    transition: opacity 1s ease;
    color: #fff;
}

.btn {
    padding: 12px 24px;
    font-size: 1rem;
    background: #f5eeef;
    color: #000;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #b1acad;
    transform: scale(1.05);
}

.letter {
    display: none;
    width: 80%;
    max-width: 550px;
    height: 600px;

    background: repeating-linear-gradient(
        to bottom,
        #fdf6e3 0px,
        #fdf6e3 27px,
        #d6d6d6 28px
    );

    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);

    overflow-y: auto;
    overflow-x: hidden;

    font-family: "Courier New", monospace;
    font-size: 1.1rem;
    line-height: 1.7;
    color: #333;

    scroll-behavior: smooth;
}

#typedText {
    padding: 40px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    text-align: left;
}
</style>
</head>

<body>

<div class="intro" id="introText">
    i hope you read this, even if it's too late.
</div>

<button class="btn" onclick="showLetter()">
    Read it
</button>

<div class="letter" id="letterBox">
    <div id="typedText"></div>
</div>

<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="panataa.mp3" type="audio/mpeg">
    Your browser does not support audio.
</audio>

<script>

const message = `hi kirs, how are you? i hope you're doing okay. i honestly don't know how to start this message because i wasn't even sure if i should send it. i'm sorry if i'm reaching out, but you've been on my mind a lot lately, and i couldn't keep these feelings to myself anymore.

i've been thinking about us—the way we used to talk every day, laugh over the smallest things, and be there for each other without it ever feeling forced. those moments felt so natural, so safe, and so real. i miss that. i miss you. and no matter how much time passes, that feeling hasn't really gone away.

before school started, i really thought i was finally moving on. i kept myself busy and convinced myself that maybe i was slowly accepting everything. but when i saw you again, everything i had been trying to bury came rushing back. that's when i realized i wasn't really healing—i was just distracting myself from how much i still miss you.

seeing you again hurt, but at the same time, it reminded me of how much comfort i still find in you. it made me realize that my feelings never really left, and that scared me because even after everything, my heart still chooses you.

while we were apart, i had a lot of time to reflect. i realized the mistakes i made, the times i hurt you, and the ways i could've loved you better. i'm truly sorry for all the pain i caused. not because i miss you, but because you never deserved to be hurt by someone who was supposed to protect your heart.

i've been trying my best to respect the space you asked for, even though it hasn't been easy. there were so many times i wanted to message you, tell you about my day, or ask how you were doing. but i held myself back because i wanted to respect your peace.

but today, i just wanted to be honest.

kirs, not to pressure you or make things difficult, but can i try again? can i court you again?

i'm not asking for everything to go back to how it was. i know trust isn't something i can earn overnight, and i know there are still wounds that i caused. but if you let me, i'm willing to take things slowly. i want to prove my sincerity through consistency, patience, understanding, and my actions—not just through words.

i want to relearn everything about you. i want to understand your silence, your fears, your happiness, and become someone who knows how to love you gently. losing you made me realize that love isn't just about feelings. it's about effort, patience, accountability, and choosing someone every single day, even when things get difficult.

and if i'm ever given another chance, i promise i'll keep choosing you.

but if your heart has already moved on, i'll understand. i won't force you or make you feel guilty. i just didn't want to spend the rest of my life wondering what would've happened if i never told you how i truly felt.

you still matter to me, and i still care about you more than i can explain. i hope you're taking care of yourself, eating well, and getting enough rest.

and if this really is where our story ends, thank you. thank you for every memory, every laugh, and every moment you shared with me. i'll always be grateful for all of it.

i miss you, kirs. i really do. and no matter how much time passes, a part of me will always be hoping that maybe, just maybe, there's still a chance for us.
`;

function showLetter() {

    // Start music
    const music = document.getElementById("bgMusic");
    music.volume = 0.5; // 50% volume
    music.play().catch(err => console.log(err));

    // Hide intro
    document.getElementById("introText").style.opacity = "0";
    document.querySelector(".btn").style.display = "none";

    setTimeout(() => {

        const letterBox = document.getElementById("letterBox");
        const typedText = document.getElementById("typedText");

        letterBox.style.display = "block";

        let i = 0;

        function typeWriter() {

            if (i < message.length) {

                typedText.textContent += message.charAt(i);
                i++;

                // Auto scroll while typing
                letterBox.scrollTop = letterBox.scrollHeight;

                setTimeout(typeWriter, 75);

            }

        }

        typeWriter();

    }, 400);

}

</script>

</body>
</html>
